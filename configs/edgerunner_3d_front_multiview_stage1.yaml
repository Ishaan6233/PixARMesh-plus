defaults:
  - edgerunner_3d_front_multiview
  - _self_

all:
  name: edgerunner-3d-front-multiview-stage1

# MV Stage 1 = layout-only, AUGMENT conditioning (obj-PC + z_i), decoder UNFROZEN.
# FULL 2-stage training analogous to SV PixARMesh: train FROM SCRATCH off the generic
# EdgeRunner base (NOT warm-started from the 3D-FRONT SV final) for the full SV-length
# 100k steps. We previously found that warm-starting from the SV final + a short re-ground
# UNDERPERFORMS this full 2-stage recipe (the warm decoder sits in an SV canonical-frame
# basin; from-scratch avoids it). Purpose: ground pose prediction on the NEW prefix
# composition (obj-PC 2048 + z_i 257 + z_scene 64 + num_face 1 = 2370) and the
# Pi3X-discovered point distribution on the EASY pose task, before full mesh-gen (Stage 2).
# Object-geometry tokens are dropped (ignore_obj_seq).
model:
  # Override the MV base config's SV-final warm-start: init from the EdgeRunner base, the
  # exact init SV stage-1 used (base_edgerunner.yaml). "From scratch" = no 3D-FRONT warm-start.
  local_path: zx1239856/edgerunner

dataset:
  src_data:
    ignore_obj_seq: true
  model:
    # prefix_len is derived from the active channels (mv_prefix_len): 2048 obj-PC +
    # 257 z_i + 64 z_scene + 1 num_face = 2370.
    mv_obj_pc_cond: true

train:
  train_args:
    # SV-matched Stage-1: 100k steps AND effective batch 64 on 4 GPUs (train_mv.sh NP=4):
    # per_device 16 x accum 1 x 4 GPUs = 64. A measured probe shows per_device 16 + 8192 obj
    # voxels peaks at ~25 GB / 143 GB, so it fits with room to spare. Overrides the base
    # config's Stage-2 batching (8 x accum 2).
    per_device_train_batch_size: 16
    gradient_accumulation_steps: 1
    max_steps: 100000
    save_steps: 5000
    eval_steps: 999999
