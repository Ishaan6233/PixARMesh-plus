defaults:
  - edgerunner_3d_front_multiview
  - _self_

all:
  name: edgerunner-3d-front-multiview-stage1

# MV Stage 1 = layout-only, AUGMENT conditioning (obj-PC + z_i), decoder UNFROZEN.
# FULL 2-stage training analogous to SV PixARMesh: train FROM SCRATCH off the generic
# EdgeRunner base (NOT warm-started from the 3D-FRONT SV final) for the full SV-length
# 100k steps. We previously found that warm-starting from the SV final + a short re-ground
# UNDERPERFORMS this full 2-stage recipe (the warm decoder sits in an SV canonical-frame
# basin; from-scratch avoids it). Purpose: ground pose prediction on the NEW prefix
# composition (obj-PC 2048 + z_i 257 + z_scene 64 + num_face 1 = 2370) and the
# Pi3X-discovered point distribution on the EASY pose task, before full mesh-gen (Stage 2).
# Object-geometry tokens are dropped (ignore_obj_seq).
model:
  # Override the MV base config's SV-final warm-start: init from the EdgeRunner base, the
  # exact init SV stage-1 used (base_edgerunner.yaml). "From scratch" = no 3D-FRONT warm-start.
  local_path: zx1239856/edgerunner

dataset:
  src_data:
    ignore_obj_seq: true
  model:
    # prefix_len is derived from the active channels (mv_prefix_len): 2048 obj-PC +
    # 257 z_i + 64 z_scene + 1 num_face = 2370.
    mv_obj_pc_cond: true

train:
  train_args:
    # Effective batch 64 on 4 GPUs (train_mv.sh NP=4): per_device 16 x accum 1 x 4 = 64.
    # Stage-1 is layout-only and exists ONLY to warm-start Stage-2; the eval gives gt_layout,
    # so layout quality is never scored. Measured loss_layout converges by ~2k steps
    # (8.0 -> 2.1 by ~300, flat ~1.74-1.78 from ~1.8k onward), so the SV-matched 100k is ~50x
    # overkill. 5k (~13h at ~10 s/step) is 2.5x past the plateau for a comfortable warm-start.
    per_device_train_batch_size: 16
    gradient_accumulation_steps: 1
    max_steps: 5000
    # Save every 1k steps (5 intermediate checkpoints) instead of only at the end:
    # a crash/pre-emption near the finish then still leaves a usable Stage-2 warm-start,
    # rather than losing the whole run (which is what happened when save_steps==max_steps).
    save_steps: 1000
    # Disable eval entirely for Stage-1: it is layout-only and scored with gt_layout, so
    # eval is never used — it is pure wasted compute AND it ran the conditioning forward on
    # the val split (the prior run aborted there). HF evaluates BEFORE the periodic save, so
    # an eval crash also takes down that step's checkpoint; "no" removes the vector outright.
    eval_strategy: "no"
    eval_steps: 999999
