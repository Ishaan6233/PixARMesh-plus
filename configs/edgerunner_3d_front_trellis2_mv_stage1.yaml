defaults:
  - edgerunner_3d_front_trellis2_mv
  - _self_

all:
  name: edgerunner-3d-front-trellis2-mv-da3-stage1
  output_dir: outputs/da3/train/stage1

model:
  local_path: zx1239856/edgerunner

dataset:
  src_data:
    ignore_obj_seq: true
  model:
    mv_obj_pc_cond: true

train:
  train_args:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 2
    max_steps: 100000
    warmup_steps: 500
    save_steps: 5000
    eval_steps: 5000
    eval_strategy: steps
    logging_steps: 1
    lr_scheduler_kwargs:
      num_stable_steps: 0
      num_decay_steps: ${sub:${train.train_args.max_steps}, ${train.train_args.warmup_steps}}
      min_lr_ratio: 0.1
