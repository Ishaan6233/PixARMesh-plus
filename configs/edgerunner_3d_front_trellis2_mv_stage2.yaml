defaults:
  - edgerunner_3d_front_trellis2_mv
  - _self_

all:
  name: edgerunner-3d-front-trellis2-mv-da3-stage2
  output_dir: outputs/da3/train/stage2

dataset:
  model:
    mv_obj_pc_cond: true

train:
  train_args:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    max_steps: 30000
    warmup_steps: 500
    save_steps: 3000
    eval_steps: 3000
    eval_strategy: steps
    logging_steps: 1
    lr_scheduler_kwargs:
      num_stable_steps: 0
      num_decay_steps: ${sub:${train.train_args.max_steps}, ${train.train_args.warmup_steps}}
      min_lr_ratio: 0.1
