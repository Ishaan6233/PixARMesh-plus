# Canonical training policy for benchmark-governed runs.
train_args:
  output_dir: checkpoints
  logging_dir: logs
  report_to: tensorboard
  eval_strategy: steps
  save_strategy: steps
  logging_strategy: steps
  logging_steps: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  max_steps: 10000
  lr_scheduler_type: warmup_stable_decay
  lr_scheduler_kwargs:
    num_stable_steps: 0
    num_decay_steps: ${sub:${train.train_args.max_steps}, ${train.train_args.warmup_steps}}
    min_lr_ratio: 0.1
  warmup_steps: 500
  save_steps: 1000
  eval_steps: 1000
  dataloader_num_workers: 8
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: false
  ddp_find_unused_parameters: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  bf16: true
  fp16: false
  resume_from_checkpoint: true

ema:
  enabled: true
  decay: 0.9999
