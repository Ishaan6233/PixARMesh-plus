# Multi-view 3D-FRONT training config.
# Dataset: datasets/3d-front-multiview  (produced by scripts/data/prepare_multiview_dataset.py)
# Model: prefix_len = mv_num_obj_queries + mv_num_scene_queries + 1 = 322

spec:
  resolution: 518
  num_points: 4096
  axis_convention: y_up_z_forward
  unit_scale: 1.0
  augmentation_policy: canonical_train_only
  coordinate_frame:
    handedness: right
    up_axis: y
    forward_axis: z
    units: meters
  normalization:
    mode: bbox
    bound: 0.95
    center: true
    preserve_aspect_ratio: true

src_data:
  type: 3d-front-multiview
  path: datasets/3d-front-multiview
  num_views: 4
  num_points: ${dataset.spec.num_points}
  norm_bound: ${dataset.spec.normalization.bound}
  with_normals: false
  num_pos_tokens: ${model.num_pos_tokens}
  random_scale: true
  random_scale_min: 0.75
  random_rotate: true
  random_rotate_min: -45.0
  random_rotate_max: 45.0
  random_jitter_point_clouds: true
  random_jitter_probability: 0.5
  random_jitter_offset: 0.01
  random_jitter_depth: true
  random_jitter_depth_offset: 0.02
  random_shift: true
  random_shift_max: 0.2
  visualize: false
  use_masked_obj_pc: true
  load_images: true
  image_preprocessor: facebook/dpt-dinov2-small-nyu
  image_size_divisor: 28
  ignore_obj_seq: false
  ignore_layout_seq: false

model:
  # OPT prefix: z_i (257) + z_scene (64) + num_face (1) = 322
  prefix_len: 322
  mv_voxel_encoder: true
  mv_num_obj_queries: 257
  mv_num_scene_queries: 64
  # Obj-PC conditioning density. SV-PixARMesh conditions its obj-PC channel on 8192 surface
  # points; the cond_encoder (-> 2048 latents) was trained at that density. Match it so the
  # multi-view-discovered points are fed in-distribution to the channel the decoder actually
  # exploits. Drop-in: cond_encoder pools any count to pc_latent_len, so prefix_len is
  # unchanged; a probe showed per_device 8 @ 8192 voxels peaks ~15 GB / 143 GB.
  # Object-PC density fed to the cond_encoder. Set to 2048 to MATCH SV's
  # local_obj_num_points (2048) and the encoder's pc_latent_len (2048): the encoder pools
  # any count to 2048 latents, so >2048 input adds cost (4x slower FPS) without capacity.
  # The old 8192 over-matched SV's *dense/scene* count, not its object PC, and was the
  # dominant training-speed cost (per-step FPS 15.7s -> 1.8s at 2048).
  mv_num_obj_voxels: 2048
  # Candidate-pool size for mask consensus. With mask_seeded_pool=True and
  # intra_obj_register=False (current), the pool IS the pre-consensus FPS step:
  # all 4-view mask pixels (~50k+) are FPS'd to pool_size BEFORE voting. A pool
  # capped at 2048 (= num_obj_voxels) loses spatial diversity pre-consensus and
  # discards the 4-view surface advantage. 8192 preserves diversity while remaining
  # tractable; the subsequent FPS to num_obj_voxels=2048 then selects the most
  # representative subset of the (now-diverse) valid object points.
  mv_pool_size: 8192
  mv_num_ctx_voxels: 1024
  mv_voxel_dim: 512
  mv_mask_feat_dim: 64
  mv_num_heads: 8
  # Instance-discovery operating point: mv2 c50 sweep (150 val objects) dominates live baseline
  # on every metric (purity 1.000 vs 0.995, usable% 80 vs 55, zero% 3.3 vs 5.3, med_pts 983 vs 312).
  # threshold=min(min_views,n_valid) → min_views=3 forced all-agree for 3-view objects; min_views=2
  # is majority consensus, which is strictly better and semantically correct.
  mv_min_views: 2
  mv_depth_rtol: 100.0
  # Fix A / CMVSA: cross-view Sim3-ICP registration of the per-view object clouds. This was
  # added to correct the ~2.3m cross-view smear caused by the (now-fixed) scene_transform
  # bug. With views now properly registered (scene_transform_n = S @ wrd2cam_ref @
  # inv(wrd2cam_n)), CMVSA is redundant AND harmful: _icp_align has no inlier gate, so on
  # already-registered complementary partial views it distorts the geometry (measured:
  # obj_geom_voxels extent inflates 2.6x, 0.60->1.08, Chamfer change 0.194). Disabled.
  # (The old "validated" numbers were measured registration-OFF, pre-fix.)
  mv_intra_obj_register: false
  mv_register_iters: 4
  # Trim [q, 1-q] extremes before computing the observed-extent normalization box.
  # Prevents mask-bleed stragglers / Pi3X partial-observation outliers from inflating
  # the canonical scale by ~1.4x (measured: aniso 4.24 → better aspect ratio).
  # q=0.0 recovers the old min/max behaviour for clean A/B.
  mv_geom_norm_quantile: 0.05
  # Pi3X conf is sigmoid'd at consumption (a probability in (0,1)); 0.5 is the calibrated
  # keep-threshold for that domain (the old 0.3 was tuned on raw logits and, post-sigmoid,
  # kept ~99% of points, near-disabling the mask-bleed purity filter).
  mv_conf_threshold: 0.5
  # Explicit geometry stream: PointEmbed(voxel xyz) added to the DINO-fused voxel
  # features so z_i / z_scene carry point-cloud cues (geometry-aware conditioning).
  # Set false to ablate appearance-only vs geometry+appearance.
  mv_use_geometry: true
  img_cond: true
  # AUGMENT (Stage 0/1): route the multi-view-discovered canonical points through the SV
  # decoder's NATIVE obj-PC channel (cond_encoder -> 2048 latents) — the channel it was
  # trained on and provably exploits (Test-1 +17%), so multi-view completeness flows
  # through a channel the decoder actually uses. Default off here; the stage configs
  # enable it and bump prefix_len to 2048 + 257 + 64 + 1 = 2370.
  mv_obj_pc_cond: false
  mv_use_voxel_encoder: true
  # Inject confidence-weighted multi-view DINO appearance into the obj-PC channel's
  # cond_encoder (extra_feat) — restores SV's always-on appearance term (img_cond_drop_prob=0).
  # Enabled with Fix A: the dual-cloud keeps the scene-frame projection index-aligned to the
  # registered geometry, so the appearance feature attaches to the correct geometry point.
  mv_obj_pc_appearance: true
