defaults:
  - edgerunner_3d_front_global_obj_pose_w_img_ctx_pi3x
  - dataset/canonical_3d_front_multiview
  - _self_

all:
  name: edgerunner-3d-front-multiview

# Initialize backbone from the BEST single-view checkpoint (verified CD 4.06 / F 81.0
# on an 80-object gt-depth eval ≈ the 4.55/80.3 full-set result) — the decoder quality
# is the ceiling on MV mesh quality, so warm-start from the strongest available SV model.
# mv_voxel_encoder weights are absent here → randomly initialized by get_model() then
# fixed by _fix_uninit_params().
model:
  local_path: outputs/edgerunner-3d-front-global-obj-pose-w-img-ctx/20260602-135736/checkpoints/final
  mv_mask_seeded_pool: true
  mv_boundary_bias_alpha: 0.0

train:
  train_args:
    # Match SV's EFFECTIVE batch of 64 at LR 1e-4, on 4 GPUs (train_mv.sh NP=4). This file is
    # the Stage-2 default: per_device 8 x accum 2 x 4 GPUs = 64 (mirrors SV Stage-2's accum-2
    # style). Stage-1 overrides to per_device 16 x accum 1 x 4 GPUs = 64. A measured
    # forward+backward probe showed Stage-2 per_device 8 @ 8192 obj voxels peaks at ~54 GB /
    # 143 GB (H200) — the prior per_device=2 (effective 8) was ~8x under-batched vs SV.
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 2
    max_steps: 30000
    save_steps: 3000
    eval_steps: 3000
    learning_rate: 1.0e-4
    bf16: true
    resume_from_checkpoint: false
    # The MV path uses the mv_voxel_encoder and (with the feature cache) bypasses the
    # frozen DINOv2/MICHE extractors, so those trainable-but-unused params trip DDP's
    # reducer on iteration 2 ("parameters that were not used in producing loss").
    # Required whenever the decoder is unfrozen (full train); harmless otherwise.
    ddp_find_unused_parameters: true
